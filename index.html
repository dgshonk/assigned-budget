<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101612">
<title>Assigned</title>
<style>
  :root { --bg:#101612; --card:#1a2420; --line:#2c3b34; --text:#e7f3ec; --muted:#93a79c; --green:#3ddc84; --amber:#f0b429; --red:#ff6b6b; --blue:#7eb6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:14px 14px 96px; }
  h1 { font-size:22px; margin:0; }
  .sub { color:var(--muted); font-size:13px; }
  button, input, select { font:inherit; color:inherit; }
  button { background:#24312b; border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  button.primary { background:var(--green); color:#072112; border:0; font-weight:700; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; }
  .hero { margin:12px 0; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .num { font-size:34px; font-weight:750; letter-spacing:-.04em; }
  .neg { color:var(--red); } .pos { color:var(--green); } .zero { color:var(--amber); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .stat { background:#121b17; border-radius:10px; padding:8px; }
  .group { margin:16px 0 6px; color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  .cat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:6px 0; }
  .cat.head { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  input[type="number"], input[type="text"], input[type="month"], select { background:#0d1411; border:1px solid var(--line); border-radius:8px; padding:8px; }
  input[type="number"] { width:96px; text-align:right; }
  .bar { height:6px; background:#0d1411; border-radius:99px; overflow:hidden; margin-top:6px; }
  .bar > span { display:block; height:100%; background:var(--green); }
  .bar.hot > span { background:var(--red); }
  .tx { padding:10px 0; border-bottom:1px solid var(--line); }
  .mini { color:var(--muted); font-size:12px; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:#0c120f; border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
  nav button { flex:1; background:transparent; border:0; color:var(--muted); }
  nav button.on { color:var(--green); }
  .drop { border:1px dashed var(--line); border-radius:14px; padding:16px; text-align:center; }
  .note { color:var(--muted); font-size:13px; }
  .sheet { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin:10px 0; }
  .tag { font-size:11px; color:var(--blue); }
</style>
</head>
<body>
<header>
  <div><h1>Assigned</h1><div class="sub">v4 · other income minus Domanic</div></div>
  <input id="month" type="month">
</header>
<section class="hero">
  <div class="sub" id="heroLabel">Cash left</div>
  <div class="num" id="heroNum">$0.00</div>
  <div class="mini" id="heroMeta"></div>
  <div class="grid">
    <div class="stat"><div class="mini">Money in</div><b id="inNum">$0</b></div>
    <div class="stat"><div class="mini">Money out</div><b id="outNum">$0</b></div>
  </div>
  <div class="stat" id="pair" style="margin-top:8px">Other money in − Domanic Hall</div>
  <div class="row" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px">
    <button class="primary" id="suggest">Fill plan</button>
    <button id="exportBtn">Export backup</button>
  </div>
</section>
<main id="view"></main>
<nav>
  <button data-tab="budget" class="on">Budget</button>
  <button data-tab="over">Over</button>
  <button data-tab="activity">Activity</button>
  <button data-tab="import">Import</button>
</nav>
<script>
const KEY = "assigned-budget-v3";
const money = n => (n<0?"-":"") + "$" + Math.abs(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,10);
const MONTHS = {jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12"};
const DEFAULT_CATS = [
  ["inc-pay","Income","Paycheck"],["inc-other","Income","Other money in"],
  ["domanic","People","Domanic Hall"],
  ["give","Giving","Giving"],["save-b","Saving","Buffer"],
  ["house","Housing","Rent"],["util","Housing","Utilities"],["phone","Housing","Phone"],
  ["gas","Transport","Gas"],["groc","Food","Groceries"],["out","Food","Eating out"],
  ["home","Personal","Household and cash"],["subs","Personal","Subscriptions"],
  ["debt","Debt","Cash App loans and overdraft"],
  ["xfer","Internal","Moved inside Cash App"]
];
const INCOME = new Set(["inc-pay","inc-other"]);
const INTERNAL = new Set(["xfer"]);
function blank() {
  const now = new Date();
  return { month: now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0"), cats: DEFAULT_CATS.map(([id,group,name])=>({id,group,name,plan:{}})), tx: [], rules: defaultRules() };
}
function defaultRules() {
  return [
    {id:"d", pattern:"domanic hall", categoryId:"domanic", exclude:false},
    {id:"g", pattern:"speedway|marathon|casey|shell|sunoco", categoryId:"gas", exclude:false},
    {id:"gr", pattern:"wal mart|walmart|wm supercenter|dollar general|kroger|meijer", categoryId:"groc", exclude:false},
    {id:"o", pattern:"steak|mcdonald|taco|wendy|arbys|hardee|dairy queen|doordash", categoryId:"out", exclude:false},
    {id:"s", pattern:"xbox|patreon|netflix|spotify", categoryId:"subs", exclude:false},
    {id:"p", pattern:"dailypay|osl retail|direct deposit", categoryId:"inc-pay", exclude:false},
    {id:"debt", pattern:"loan repayment|loan drawdown|overdraft", categoryId:"debt", exclude:false}
  ];
}
let state = load();
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.tx) return s; } catch(e) {} return blank(); }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function textOf(t) { return ((t.payee||"")+" "+(t.memo||"")+" "+(t.type||"")).toLowerCase(); }
function isInternal(t) {
  const p = textOf(t);
  if (/canceled|voided/.test(p)) return true;
  if (/instant transfer|atm withdrawal|visa debit|mastercard debit/.test(p)) return false;
  return /to savings|from savings|paycheck: transfer to savings|from spending|to spending/.test(p);
}
function decorate(t) {
  const rule = state.rules.find(r => { try { return new RegExp(r.pattern,"i").test((t.payee||"")+" "+(t.memo||"")); } catch(e) { return false; } });
  const categoryId = t.categoryId || (rule ? rule.categoryId : (t.amount > 0 ? "inc-other" : "home"));
  const excluded = t.excluded != null ? t.excluded : isInternal({...t, categoryId});
  return { id:t.id||uid(), date:t.date, payee:t.payee||"Unknown", memo:t.memo||"", amount:Number(t.amount)||0, fee:Number(t.fee)||0, source:t.source||"Import", account:t.account||"Cash App", type:t.type||"", categoryId, excluded, savings: !!t.savings };
}
function monthOf(d){ return (d||"").slice(0,7); }
function active(m){ return state.tx.filter(t => monthOf(t.date)===m && !t.excluded); }
function cashIn(m){ return active(m).filter(t => t.amount>0).reduce((s,t)=>s+t.amount,0); }
function cashOut(m){ return active(m).filter(t => t.amount<0).reduce((s,t)=>s+Math.abs(t.amount)+ (t.fee||0),0); }
function spent(id,m){ return active(m).filter(t => t.categoryId===id && t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0); }
function received(id,m){ return active(m).filter(t => t.categoryId===id && t.amount>0).reduce((s,t)=>s+t.amount,0); }
function catName(id){ const c = state.cats.find(x=>x.id===id); return c?c.name:id; }
function esc(s){ return String(s||"").replace(/[&<>]/g, c => ({'&':'&','<':'<','>':'>'}[c])); }

function render() {
  const m = state.month;
  document.getElementById("month").value = m;
  const inn = cashIn(m), out = cashOut(m), left = inn - out;
  const num = document.getElementById("heroNum");
  num.textContent = money(left);
  num.className = "num " + (left < -0.004 ? "neg" : left > 0.004 ? "pos" : "zero");
  document.getElementById("heroLabel").textContent = left < -0.004 ? "Overspent" : "Cash left";
  const ignored = state.tx.filter(t => monthOf(t.date)===m && t.excluded).length;
  document.getElementById("heroMeta").textContent = ignored + " internal moves ignored · not counted until money leaves Cash App";
  document.getElementById("inNum").textContent = money(inn);
  document.getElementById("outNum").textContent = money(out);
  const other = received("inc-other", m);
  const dom = spent("domanic", m);
  const net = other - dom;
  document.getElementById("pair").innerHTML = "Other money in "+money(other)+" − Domanic Hall "+money(dom)+" = <b class=\""+(net<0?"neg":"pos")+"\">"+money(net)+"</b>";
  const tab = document.querySelector("nav button.on").dataset.tab;
  const view = document.getElementById("view");
  if (tab==="budget") view.innerHTML = budgetView(m);
  if (tab==="over") view.innerHTML = overView(m);
  if (tab==="activity") view.innerHTML = activityView(m);
  if (tab==="import") view.innerHTML = importView();
  bind();
}
function budgetView(m) {
  const groups = [];
  for (const c of state.cats) if (!groups.includes(c.group)) groups.push(c.group);
  return groups.map(g => `<div class="group">${g}</div>` + state.cats.filter(c=>c.group===g).map(c => {
    const plan = Number(c.plan[m]||0);
    const used = INCOME.has(c.id) ? received(c.id,m) : spent(c.id,m);
    const remain = plan - used;
    const pct = plan>0 ? Math.min(100, Math.round(used/plan*100)) : (used>0?100:0);
    return `<div class="cat"><div class="cat head"><div><b>${c.name}</b><div class="mini">${INCOME.has(c.id)?"In":"Spent"} ${money(used)} · ${remain<0?"over "+money(remain):"left "+money(remain)}</div><div class="bar ${used>plan && plan>0?"hot":""}"><span style="width:${pct}%"></span></div></div><input type="number" step="1" data-plan="${c.id}" value="${plan||""}" placeholder="plan"></div></div>`;
  }).join("")).join("") + `<p class="note">The big number is real money in minus real money out. It goes negative when you spent more than came in. The plan boxes are what you meant to spend.</p>`;
}
function overView(m) {
  const rows = state.cats.filter(c => !INCOME.has(c.id) && !INTERNAL.has(c.id)).map(c => {
    const plan = Number(c.plan[m]||0), used = spent(c.id,m);
    return {c, used, over: used - plan};
  }).filter(r => r.used>0).sort((a,b)=>b.over-a.over);
  if (!rows.length) return `<p class="note">Nothing spent this month yet.</p>`;
  return rows.map(r => `<div class="cat"><b>${r.c.name}</b><div class="mini">Spent ${money(r.used)} · plan ${money(Number(r.c.plan[m]||0))} · ${r.over>0?"over "+money(r.over):"under plan"}</div></div>`).join("");
}
function activityView(m) {
  const rows = state.tx.filter(t => monthOf(t.date)===m).sort((a,b)=>b.date.localeCompare(a.date) || b.payee.localeCompare(a.payee));
  if (!rows.length) return `<p class="note">No lines this month. Import a statement.</p>`;
  return `<p class="note">Exclude only if it never left Cash App. Include if it hit a card, a person, an ATM, or your bank.</p>` + rows.slice(0,80).map(t => `<div class="tx"><div><b>${esc(t.payee)}</b> <span class="tag">${t.excluded?"internal":catName(t.categoryId)}</span><div class="mini">${t.date} · ${esc(t.memo||t.account)}</div></div><div style="display:flex; justify-content:space-between; gap:8px; margin-top:6px"><b>${money(t.amount)}</b><button data-ex="${t.id}">${t.excluded?"Include":"Exclude"}</button></div><select data-cat="${t.id}">${state.cats.map(c=>`<option value="${c.id}" ${c.id===t.categoryId?"selected":""}>${c.name}</option>`).join("")}</select></div>`).join("") + (rows.length>80?`<p class="note">Showing 80 of ${rows.length}.</p>`:"");
}
function importView() {
  const sav = state.tx.filter(t => t.savings).length;
  const internal = state.tx.filter(t => t.excluded).length;
  return `<div class="drop"><b>Upload a Cash App PDF</b><div class="mini">Spending or savings. v3 reads the statement itself.</div><input id="file" type="file" accept=".pdf,.csv,application/pdf,text/csv,.json" multiple style="margin-top:10px"></div>
  <div class="sheet"><b>Savings check</b><p class="note">${sav?sav+" savings lines loaded. Internal moves are matched so a transfer is not spent twice.":"Add the savings statement here. To Savings and From Savings stay excluded until that money leaves Cash App."}</p><p class="note">${internal} internal lines ignored across all months.</p></div>
  <div class="sheet"><button id="exportBtn2">Export backup</button><input id="backup" type="file" accept="application/json,.json"><p class="note">Importing a backup replaces this phone's copy.</p></div>`;
}
function bind() {
  document.querySelectorAll("[data-plan]").forEach(el => el.onchange = () => { state.cats.find(c=>c.id===el.dataset.plan).plan[state.month] = Number(el.value||0); save(); render(); });
  document.querySelectorAll("[data-cat]").forEach(el => el.onchange = () => {
    const t = state.tx.find(x=>x.id===el.dataset.cat);
    t.categoryId = el.value; t.excluded = INTERNAL.has(el.value) || isInternal(t); learn(t); save(); render();
  });
  document.querySelectorAll("[data-ex]").forEach(el => el.onclick = () => { const t = state.tx.find(x=>x.id===el.dataset.ex); t.excluded = !t.excluded; save(); render(); });
  const file = document.getElementById("file"); if (file) file.onchange = () => handleFiles(file.files);
  const backup = document.getElementById("backup"); if (backup) backup.onchange = () => importBackup(backup.files[0]);
  const ex2 = document.getElementById("exportBtn2"); if (ex2) ex2.onclick = exportBackup;
}
function learn(t) {
  const word = (t.payee||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").trim().split(" ").slice(0,3).join(" ");
  if (word.length<4 || state.rules.some(r=>r.pattern===word)) return;
  state.rules.unshift({id:uid(), pattern:word, categoryId:t.categoryId, exclude:t.excluded});
}
function parseCsv(text) {
  const rows=[]; let row=[], cur="", q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cur+='"'; i++;} else q=false; } else cur+=c; }
    else if(c=='"') q=true; else if(c==','){ row.push(cur); cur=""; } else if(c=='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(c!='\r') cur+=c;
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
function normDate(s){
  s=String(s||"").trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return y+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0"); }
  m=s.match(/^([A-Za-z]{3})\s+(\d{1,2})(?:\s+(\d{4}))?/);
  if(m){ const mm=MONTHS[m[1].toLowerCase()]; if(!mm) return ""; return (m[3]||"2026")+"-"+mm+"-"+m[2].padStart(2,"0"); }
  return "";
}
function rowsFromCsv(text, filename){
  const rows=parseCsv(text); if(rows.length<2) return [];
  const h=rows[0].map(x=>String(x).toLowerCase());
  const idx=names=>h.findIndex(x=>names.some(n=>x.includes(n)));
  const iDate=idx(["date"]), iAmt=idx(["amount"]), iName=idx(["name","description","payee"]), iMemo=idx(["notes","details","memo"]), iFee=idx(["fee"]);
  const out=[];
  for(const r of rows.slice(1)){
    const date=normDate(r[iDate]||""); let amount=Number(String(r[iAmt]||"").replace(/[$,+\s]/g,""));
    if(!date||!isFinite(amount)) continue;
    if(!/[+-]/.test(String(r[iAmt]||"")) && amount>0 && /out|debit|sent/.test(String(r[iMemo]||""))) amount=-amount;
    const raw=String(r[iAmt]||"");
    if(raw.includes("+")) amount=Math.abs(amount);
    else if(!raw.includes("-") && amount>0 && /transfer to|payment to|withdrawal/.test((r[iName]||"")+" "+(r[iMemo]||""))) amount=-amount;
    out.push({date, payee:r[iName]||"Cash App", memo:iMemo>=0?r[iMemo]:"", amount, fee:iFee>=0?Number(String(r[iFee]).replace(/[$,]/g,""))||0:0, source:filename, account:filename, savings:/saving/i.test(filename)});
  }
  return out;
}
async function inflateZlib(bytes){
  const ds=new DecompressionStream("deflate");
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
function parseCmap(text){
  const cmap={};
  const block=(text.split("beginbfrange")[1]||"").split("endbfrange")[0];
  for(const line of block.split("\n")){
    const parts=[...line.matchAll(/<([0-9A-Fa-f]+)>/g)].map(x=>x[1]);
    if(parts.length===3){
      const start=parseInt(parts[0],16), end=parseInt(parts[1],16), uni=parseInt(parts[2],16);
      for(let n=start;n<=end;n++) cmap[n]=String.fromCharCode(uni+(n-start));
    }
  }
  return cmap;
}
function decodeLit(raw, cmap){
  const bytes=[];
  for(let i=0;i<raw.length;i++){
    if(raw[i]==="\\" && i+1<raw.length){ bytes.push(raw.charCodeAt(++i)&255); }
    else bytes.push(raw.charCodeAt(i)&255);
  }
  let s="";
  for(let i=0;i+1<bytes.length;i+=2) s+=cmap[(bytes[i]<<8)|bytes[i+1]]||"";
  return s;
}
async function pdfText(data){
  const raw=new TextDecoder("latin1").decode(data);
  const streams=[];
  const re=/stream\r?\n([\s\S]*?)endstream/g; let m;
  while((m=re.exec(raw))){
    let chunk=m[1]; if(chunk.endsWith("\r\n")) chunk=chunk.slice(0,-2); else if(chunk.endsWith("\n")) chunk=chunk.slice(0,-1);
    const bytes=Uint8Array.from(chunk, ch=>ch.charCodeAt(0)&255);
    try { streams.push(new TextDecoder("latin1").decode(await inflateZlib(bytes))); }
    catch(e){ streams.push(chunk); }
  }
  const cmaps=streams.filter(s=>s.includes("beginbfrange")).map(parseCmap).sort((a,b)=>Object.keys(b).length-Object.keys(a).length);
  const cmap=cmaps[0]||{};
  const lines=[];
  for(const s of streams){
    const arr=/\[(.*?)\]\s*TJ/gs;
    let hit;
    while((hit=arr.exec(s))){
      const bits=[...hit[1].matchAll(/\((?:\\.|[^\\)])*\)/g)];
      const text=bits.map(b=>decodeLit(b[0].slice(1,-1), cmap)).join("").trim();
      if(text) lines.push(text);
    }
  }
  return lines;
}
function rowsFromStatementLines(lines, filename){
  const out=[]; const savings=/saving/i.test(filename);
  for(let i=0;i<lines.length;i++){
    const date=normDate(lines[i]);
    if(!date || !/^[A-Za-z]{3}\s+\d/.test(lines[i])) continue;
    const chunk=[];
    for(let j=i+1;j<lines.length && j<i+6;j++){
      if(/^[A-Za-z]{3}\s+\d{1,2}$/.test(lines[j])) break;
      chunk.push(lines[j]);
    }
    const amtLine=[...chunk].reverse().find(x=>/[+]?\s*[0-9,]+\.\d{2}/.test(x) && !/fee/i.test(x));
    if(!amtLine) continue;
    const nums=chunk.filter(x=>/^[+]?\s*[0-9,]+\.\d{2}$/.test(x.replace(/\$/g,"").trim()));
    const amountRaw=(nums[nums.length-1]||amtLine).replace(/[$,\s]/g,"");
    let amount=Number(amountRaw.replace("+",""));
    if(!amountRaw.includes("+")) amount=-Math.abs(amount);
    const fee=nums.length>1?Number(nums[0].replace(/[+,$\s]/g,""))||0:0;
    const words=chunk.filter(x=>!/^[+]?\s*[0-9,]+\.\d{2}$/.test(x.replace(/\$/g,"").trim()));
    out.push({date, payee:words[0]||"Cash App", memo:words[1]||"", amount, fee, source:filename, account:savings?"Cash App Savings":"Cash App", savings});
  }
  return out;
}
async function rowsFromPdf(file){
  const lines=await pdfText(new Uint8Array(await file.arrayBuffer()));
  const rows=rowsFromStatementLines(lines, file.name);
  if(!rows.length) alert("Opened the PDF but found no statement lines. Send it in the chat and I will match this layout.");
  return rows;
}
function matchSavings(){
  const spend=state.tx.filter(t=>!t.savings && isInternal(t));
  const save=state.tx.filter(t=>t.savings);
  for(const t of spend){
    const hit=save.find(s=>s.date===t.date && Math.abs(s.amount+t.amount)<0.02);
    t.matched=!!hit; if(hit) hit.matched=true;
  }
}
async function handleFiles(files){
  let added=0, skipped=0;
  for(const file of files){
    let items=[];
    if(/\.json$/i.test(file.name)){ await importBackup(file); return; }
    if(/\.pdf$/i.test(file.name)) items=await rowsFromPdf(file);
    else items=rowsFromCsv(await file.text(), file.name);
    for(const item of items){
      const key=item.date+"|"+Number(item.amount).toFixed(2)+"|"+item.payee.toLowerCase();
      if(state.tx.some(t=>(t.date+"|"+Number(t.amount).toFixed(2)+"|"+t.payee.toLowerCase())===key)){ skipped++; continue; }
      state.tx.push(decorate(item)); added++;
    }
  }
  matchSavings(); save();
  alert("Added "+added+" lines. Skipped "+skipped+" duplicates.");
  render();
}
function suggest(){
  const m=state.month; const [y,mo]=m.split("-").map(Number); const prev=[];
  for(let i=1;i<=3;i++){ const d=new Date(y,mo-1-i,1); prev.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
  for(const c of state.cats){
    if(INTERNAL.has(c.id)) continue;
    const vals=prev.map(pm=>INCOME.has(c.id)?received(c.id,pm):spent(c.id,pm)).filter(v=>v>0);
    if(vals.length) c.plan[m]=Math.round(vals.reduce((s,v)=>s+v,0)/vals.length);
  }
  save(); render();
}
function exportBackup(){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:"application/json"})); a.download="assigned-backup-"+state.month+".json"; a.click(); }
async function importBackup(file){ const next=JSON.parse(await file.text()); if(!next.tx||!next.cats) return alert("Not an Assigned backup."); state=next; save(); render(); }
document.getElementById("month").onchange=e=>{ state.month=e.target.value; save(); render(); };
document.getElementById("suggest").onclick=suggest;
document.getElementById("exportBtn").onclick=exportBackup;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); render(); });
render();
</script>
</body>
